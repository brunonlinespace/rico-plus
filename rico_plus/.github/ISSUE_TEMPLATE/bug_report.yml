name: Bug report
description: Report a reproducible Rico Plus problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Rico Plus version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime mode
      options:
        - AppImage
        - Source / portable
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop, and display server
      placeholder: "Fedora 43 or 44, XFCE or Plasma, X11 or Wayland"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest exact sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and terminal output
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, Workspace size, document count, and whether the issue repeats.
